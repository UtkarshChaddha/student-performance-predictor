<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Adhyan Dashboard</title>

    <link rel="stylesheet" href="dashboard.css">
</head>

<body>

    <!-- ========================= -->
    <!--        NAVBAR             -->
    <!-- ========================= -->

    <nav>

        <!-- Adhyan Logo -->
        <div class="logo">
            <img src="logo.png" alt="Adhyan">
        </div>


        <!-- Main Navigation -->
        <div class="nav-links">

            <!-- Home -->
            <button type="button" class="nav-button">
                <img src="homeicon.png" alt="">
                <span>Home</span>
            </button>


            <!-- Subjects -->
            <button type="button" class="nav-button">
                <img src="subjecticon.png" alt="">
                <span>Subjects</span>
            </button>


            <!-- Tests -->
            <button type="button" class="nav-button">
                <img src="testicon.png" alt="">
                <span>Tests</span>
            </button>


            <!-- Problems -->
            <button type="button" class="nav-button">
                <img src="problemicon.png" alt="">
                <span>Problems</span>
            </button>

        </div>


        <!-- User Actions -->
        <div class="user-actions">

            <!-- Greeting -->
            <span class="user-greeting">
                Hi, Utkarsh 👋
            </span>


            <!-- Streak -->
            <button type="button">
                🔥 12
            </button>


            <!-- Notifications -->
            <button type="button">
                🔔
            </button>


            <!-- Profile -->
            <button type="button">
                Profile
            </button>

        </div>

    </nav>


    <!-- ========================= -->
    <!--        SIDEBAR            -->
    <!-- ========================= -->

    <aside>
        navigation
    </aside>


    <!-- ========================= -->
    <!--      MAIN DASHBOARD        -->
    <!-- ========================= -->

    <main>

        <h1>
            Good morning, Utkarsh 👋
        </h1>

        <p>
            Ready to continue learning?
        </p>

        <button type="button">
            Continue Learning →
        </button>

    </main>


</body>

</html>
