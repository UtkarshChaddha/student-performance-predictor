<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Adhyan Login Page</title>

    <!-- Sora Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="login.css">

</head>


<body>

    <!-- ========================= -->
    <!--          LOGO             -->
    <!-- ========================= -->

    <div class="logo">

        <img
            src="logo.png"
            alt="Adhyan logo"
        >

    </div>


    <!-- ========================= -->
    <!--         TAGLINE           -->
    <!-- ========================= -->

    <div class="tagline">

        <ul>

            <li>learn</li>
            <li>evolve</li>
            <li>succeed</li>

        </ul>

    </div>


    <!-- ========================= -->
    <!--        LOGIN CARD         -->
    <!-- ========================= -->

    <div class="login">

        <form id="loginForm">

            <h2>Login</h2>


            <!-- EMAIL -->

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
            >


            <!-- PASSWORD -->

            <div class="password-box">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                >

                <button
                    type="button"
                    id="togglePassword"
                >
                    Show
                </button>

                <a href="#">
                    Forgot password?
                </a>

            </div>


            <!-- ========================= -->
            <!--        ROLE SELECTOR       -->
            <!-- ========================= -->

            <div class="role-selector">

                <label>
                    Continue as
                </label>


                <div class="role-options">

                    <!-- TRAINEE -->

                    <button
                        type="button"
                        class="role-option active"
                        data-role="trainee"
                    >
                        <span class="role-icon">🎓</span>
                        <span>Trainee</span>
                    </button>


                    <!-- TRAINER -->

                    <button
                        type="button"
                        class="role-option"
                        data-role="trainer"
                    >
                        <span class="role-icon">👨‍🏫</span>
                        <span>Trainer</span>
                    </button>


                    <!-- ADMIN -->

                    <button
                        type="button"
                        class="role-option"
                        data-role="admin"
                    >
                        <span class="role-icon">👑</span>
                        <span>Admin</span>
                    </button>

                </div>


                <!-- Hidden value that JS/backend can use later -->

                <input
                    type="hidden"
                    id="selectedRole"
                    name="role"
                    value="trainee"
                >

            </div>


            <!-- STAY SIGNED IN -->

            <label>

                <input
                    type="checkbox"
                    id="staySignedIn"
                >

                Stay signed in

            </label>


            <!-- LOGIN BUTTON -->

            <button type="submit">
                Login
            </button>


            <!-- DIVIDER -->

            <div class="divider">

                <span>OR</span>

            </div>


            <!-- GOOGLE LOGIN -->

            <button
                type="button"
                id="googleLogin"
            >

                <span>G</span>

                <span>
                    Continue with Google
                </span>

            </button>

        </form>

    </div>


    <!-- JavaScript -->

    <script src="login.js"></script>

</body>

</html>
